<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style1.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <header class="header">
    <div class="PetNet-home">
      <img src="img/logo_2.png" alt="PetNet" class="petnet-img">
      <a href="#acceuil" class="link-PetNet">
        PetNet
      </a>
    </div>
    <nav class="nav">
      <div class="a-nav">
        <ul class="ul-nav">
          <li><a href="index.html">Acceuil</a></li>
          <li><a href="catalogue.html">Boutique</a></li>
          <li><a href="details.html">Adoption</a></li>
          <li><a href="Service.html">Services</a></li>
          <li><a href="Contact.html" class="active-link">Contact</a></li>
        </ul>
      </div>
    </nav>
    <div class="button">
      <a class="button-a">Prendre RDV</a>
    </div>
  </header>
  <main class="contact">
    <section>
      <h1>Prendre rendez-vous</h1>
      <form>
        <div class="form-row">
          <div class="form-group">
            <label for="nom">Nom complet *</label>
            <input type="text" id="nom" name="nom" placeholder="Ex. Sara Benali" required>
          </div>
          <div class="form-group">
            <label for="email">Adresse e-mail *</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.com" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="service">Service *</label>
            <select id="service" name="service" required>
              <option value="">Choisir un service</option>
              <option value="Toilettage">Toilettage</option>
              <option value="Veterinaire">Consultation</option>
              <option value="Pension">Pension</option>
              <option value="Autre">Autre</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">Date souhaitée *</label>
            <input type="date" id="date" name="date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea id="message" name="message" placeholder="Race, taille et besoins particuliers de votre animal..."
            required></textarea>
        </div>
        <button type="submit">
          Envoyer la demande
        </button>
      </form>
    </section>
    <aside>
      <div class="info">
        <h2>La boutique</h2>
        <p>12 rue des Lilas, Casablanca</p>
        <p>05 22 00 00 00</p>
        <p>bonjour@petnest.ma</p>
        <p>Lundi - samedi : 9 h - 19 h</p>
      </div>
      <iframe class="map"
       <!--f-->/iframe> src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3372.704375360696!2d-9.23778852442978!3d32.292925173869634!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xdac211719897669%3A0x6f59fa5bb517f58a!2sYouCode%20Safi!5e0!3m2!1sfr!2sma!4v1792119571438!5m2!1sfr!2sma"
        width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">

        <div class="social">
          <h2>Suivez-nous</h2>

          <a href="https://www.instagram.com/" target="_blank" rel="noopener">
            Instagram
          </a>

          <a href="https://www.youtube.com/" target="_blank" rel="noopener">
            YouTube
          </a>
        </div>
    </aside>

  </main>
  <footer>
    <div class="conteneur">

      <!-- Partie supérieure du footer -->
      <div class="pied-haut">

        <!-- Bloc Marque / Présentation -->
        <div class="colonne-marque">
          <h1 class="logo logo-clair">
            <img src="img/logo_2.png" alt="PetNest Logo" class="logofoter">
            PetNest
          </h1>
          <p>Produits, adoption responsable et services pour le bien-être de vos animaux.</p>
          <div class="reseaux-sociaux-icons">
            <img src="img/instagram.png" alt="Instagram" class="reseaux-sociaux-icons">
            <img src="img/youtube.png" alt="YouTube" class="reseaux-sociaux-icons">
            <img src="img/share.png" alt="Share" class="reseaux-sociaux-icons">
          </div>
        </div>

        <!-- Bloc Boutique -->
        <div class="boutique">
          <h3>Boutique</h3>
          <ul>
            <li><a href="#">Chiens</a></li>
            <li><a href="#">Chats</a></li>
            <li><a href="#">Rongeurs</a></li>
            <li><a href="#">Oiseaux</a></li>
            <li><a href="#">Poissons</a></li>
          </ul>
        </div>

        <!-- Bloc Aide -->
        <div class="Aide">
          <h3>Aide</h3>
          <ul>
            <li>FAQ</li>
            <li>Livraison</li>
            <li>Retours</li>
            <li>Conditions générales</li>
          </ul>
        </div>

        <!-- Bloc Contact -->
        <div class="contact">
          <h3>Contact</h3>
          <ul>
            <li>
              <img src="img/placeholder.png" alt="Location Icon" class="contact-icon">
              <span id="location">12 rue des Lilas, Casablanca</span>
            </li>
            <li>
              <img src="img/phone-call.png" alt="Phone Icon" class="contact-icon">
              <span id="call">05 22 00 00 00</span>
            </li>
            <li>
              <img src="img/email.png" alt="Mail Icon" class="contact-icon">
              <span id="mail">bonjour@petnest.ma</span>
            </li>
            <li>
              <img src="img/clock.png" alt="Clock Icon" class="contact-icon">
              <span>Lun – Sam : 9 h – 19 h</span>
            </li>
          </ul>
        </div>

      </div>

      <!-- Partie inférieure du footer -->
      <div class="pied-bas">
        <p>© 2026 PetNest. Tous droits réservés.</p>
        <p><a href="#">Mentions légales</a> · <a href="#">Confidentialité</a></p>
      </div>

    </div>
  </footer>
</body>

</html>
